# ================= Android Build =================
  android-build:
    name: 🤖 Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Rename Android builds
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk Codis-${{ env.VERSION }}-Android.apk
          mv build/app/outputs/bundle/release/app-release.aab Codis-${{ env.VERSION }}-Android.aab

      - name: Upload Android Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            Codis-${{ env.VERSION }}-Android.apk
            Codis-${{ env.VERSION }}-Android.aab
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ================= Web Build =================
  web-build:
    name: 🌐 Build Web & Deploy
    runs-on: ubuntu-latest
    needs: [windows-build, android-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href "/codis/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
