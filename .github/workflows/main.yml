name: Multi-Platform Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: ""
        required: false

  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  VERSION: ${{ github.event.inputs.tag_name || github.ref_name }}

