name: Multi-Platform Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Codis ,develop by hosivay"
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ================= Windows Build =================
  windows-build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Copy Windows SDK tools to short path and build
        shell: pwsh
        run: |
          $base = "C:\Program Files (x86)\Windows Kits\10\bin"
          $version = Get-ChildItem $base -Directory | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty Name
          $srcX64 = Join-Path $base "$version\x64"
          $sdkDir = "C:\sdkbin"
          New-Item -ItemType Directory -Force -Path $sdkDir | Out-Null
          Copy-Item -Path "$srcX64\*" -Destination $sdkDir -Recurse -Force
          $env:PATH = "$sdkDir;$env:PATH"
          flutter build windows --release

      - name: Zip Windows Build with proper name
        run: |
          $version="${{ github.event.inputs.tag_name || github.ref_name }}"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "Codis-${version}-Windows.zip"

      - name: Upload Windows Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: "Codis-${{ github.event.inputs.tag_name || github.ref_name }}-Windows.zip"
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================= Android Build =================
  android-build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Rename Android builds
        run: |
          version="${{ github.event.inputs.tag_name || github.ref_name }}"
          mv build/app/outputs/flutter-apk/app-release.apk "Codis-${version}-Android.apk"
          mv build/app/outputs/bundle/release/app-release.aab "Codis-${version}-Android.aab"

      - name: Upload Android Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: "Codis-${{ github.event.inputs.tag_name || github.ref_name }}-Android.apk,Codis-${{ github.event.inputs.tag_name || github.ref_name }}-Android.aab"
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================= Web Build =================
  web-build:
    name: Build Web and Deploy
    runs-on: ubuntu-latest
    needs: [windows-build, android-build]

    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release --base-href "/codis/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
