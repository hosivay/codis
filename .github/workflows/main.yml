name: Multi-Platform Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: ""
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ================= Windows Build =================
  windows-build:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows Release
        shell: pwsh
        run: |
          $base = "C:\Program Files (x86)\Windows Kits\10\bin"
          $sdkVersion = Get-ChildItem $base -Directory | Where-Object { $_.Name -match '^\d+\.\d+' } | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty Name
          if (-not $sdkVersion) { throw "No Windows SDK version folder in $base" }
          $pathX64 = Join-Path $base "$sdkVersion\x64"
          $pathX86 = Join-Path $base "$sdkVersion\x86"
          $sdkDir = Join-Path $env:GITHUB_WORKSPACE "winsdkbin"
          New-Item -ItemType Directory -Force -Path $sdkDir | Out-Null
          Copy-Item -Path "$pathX86\*" -Destination $sdkDir -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$pathX64\*" -Destination $sdkDir -Recurse -Force -ErrorAction SilentlyContinue
          $env:PATH = "$sdkDir;$env:PATH"
          [System.Environment]::SetEnvironmentVariable("PATH", "$sdkDir;$([System.Environment]::GetEnvironmentVariable('PATH', 'Process'))", "Process")
          flutter build windows --release

      - name: Zip Windows artifact
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.tag_name || github.ref_name }}"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Codis-$ver-Windows.zip"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: "Codis-${{ github.event.inputs.tag_name || github.ref_name }}-Windows.zip"
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================= Android Build =================
  android-build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Rename Android builds
        run: |
          version="${{ github.event.inputs.tag_name || github.ref_name }}"
          mv build/app/outputs/flutter-apk/app-release.apk "Codis-${version}-Android.apk"
          mv build/app/outputs/bundle/release/app-release.aab "Codis-${version}-Android.aab"

      - name: Upload Android Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            Codis-${{ github.event.inputs.tag_name || github.ref_name }}-Android.apk
            Codis-${{ github.event.inputs.tag_name || github.ref_name }}-Android.aab
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================= Web Build =================
  web-build:
    name: Build Web and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href "/codis/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
