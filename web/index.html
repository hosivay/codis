<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A sleek Flutter app for encoding and decoding messages with support for multiple cipher algorithms. Secure, elegant, and built with care.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Codis">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="any">

  <title>Codis – Secure text encryption</title>
  <meta name="theme-color" content="#0382B3">
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      background: #F6F8FA;
      color: #1F2328;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #0D1117;
        color: #E6EDF3;
      }
    }
    .loader-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    .loader {
      position: relative;
      width: 56px;
      height: 56px;
      border: 3px solid rgba(3, 130, 179, 0.25);
      border-top-color: #0382B3;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }
    .loader::before {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      right: 4px;
      bottom: 4px;
      border: 3px solid transparent;
      border-top-color: #026B94;
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite reverse;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .logo {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .shimmer {
      width: 120px;
      height: 4px;
      background: linear-gradient(90deg,
        transparent 0%,
        #0382B3 40%,
        #0382B3 60%,
        transparent 100%);
      background-size: 200% 100%;
      border-radius: 2px;
      animation: shimmer 1.5s ease-in-out infinite;
    }
    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loader-wrapper">
    <div class="loader"></div>
    <span class="logo">Codis</span>
    <div class="shimmer"></div>
  </div>
  <script>
    (function() {
      function setAutocompleteOff() {
        document.querySelectorAll('input[type="password"]').forEach(function(el) {
          el.setAttribute('autocomplete', 'off');
        });
      }
      if (document.body) {
        setAutocompleteOff();
        var observer = new MutationObserver(setAutocompleteOff);
        observer.observe(document.body, { childList: true, subtree: true });
      } else {
        document.addEventListener('DOMContentLoaded', function() {
          setAutocompleteOff();
          var observer = new MutationObserver(setAutocompleteOff);
          observer.observe(document.body, { childList: true, subtree: true });
        });
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
